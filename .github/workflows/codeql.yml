# CodeQL — análisis estático de seguridad. Gratis en repositorios públicos.
#
# El horario semanal no es decoración: la mayoría de los avisos nuevos no llegan porque cambie tu
# código, sino porque cambia lo que se sabe. Un análisis que solo corre al hacer push nunca se entera.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
